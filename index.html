<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hive 3.0 Interface</title>
    
    
    <script src="script.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="pictures/bg.png" class="background-canvas" alt="Фон">

</body>


<div class="welcome-container">
    

     <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; gap: 24px; pointer-events: none;">
        
        <img src="pictures/enter.png" class="smooth-appearance text-logo" alt="Входной текст">
        
        <button class="enter-button">
            Прямо сейчас
        </button>
</div>
<div id="modal-window" style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; justify-content: center; align-items: center; z-index: 100;">
    <div class="honey-card">
        <button id="close-modal" class="close-btn">&times;</button>
        <h2>Подключиться к базе данных</h2>
        <input type="text" id="enter-id" placeholder="ID ПАСЕКИ + ENTER">
    </div>
</div>


</html>
