<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hive 3.0 Interface</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="pictures/bg.png" class="background-canvas" alt="Фон">

</body>
<script>
    // элемент подключения стилей программно
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    
    // Добавляем к названию style.css текущее время в миллисекундах
    link.href = 'style.css?v=' + Date.now();
    
    // Вставляем эту строчку в шапку сайта
    document.head.appendChild(link);
</script>

<div class="welcome-container">
    

    <img src="pictures/enter.png" class="smooth-appearance text-logo" alt="Входной текст" style="max-width: 80%; height: auto;">

</div>

</html>
