<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hive 3.0 Interface</title>
    
    
    <script src="script.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="workspace-body">
    <h1>Данные пасеки</h1>

    <div class="tab_contain">
        <button class="tab-btn active" data-tab="humidity">Влажность</button>
        <button class="tab-btn" data-tab="temperature">Температура</button>
        <button class="tab-btn" data-tab="sounds">Звуки</button>
        <button class="tab-btn" data-tab="analysis">Анализ</button>
    </div>

    <h2 id="table-title">Все данные</h2>

    <table>
        <thead>
        <tr>
            <th>Улей</th>
            <th>Значение</th>
            <th>Единицы измерения</th>
            <th>Время</th>
        </tr>
        </thead>
        <tbody id="dynamic-table-body"></tbody>
    </table>
</body>
</html>
